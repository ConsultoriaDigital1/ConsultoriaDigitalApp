services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-consultoria_digital}"
      POSTGRES_USER: "${POSTGRES_USER:-consultoria_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cambiar_password}"
    volumes:
      - consultoria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  consultoria_postgres_data:
